# Weekly updates, grouped into one pull request per ecosystem to keep the
# number of open pull requests low. Commit prefixes keep titles valid
# Conventional Commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: [/, /pet_recognition_engine]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Pinned to the version of Home Assistant's camera integration at the
      # oldest Home Assistant supported, whose tests refuse anything newer.
      # It moves with that minimum, by hand.
      - dependency-name: "pyturbojpeg"
    groups:
      python:
        patterns: ["*"]
