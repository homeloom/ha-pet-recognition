name: CI

# CI of the Pet Recognition integration, built from the shared workflows of
# homeloom/ci. Branch protection requires the Report job.
#
# Draft pull requests run no job at all, which saves runner minutes while the
# work is in progress. Marking the pull request ready for review runs CI once.
# Editing the title or body runs it again, because the title becomes the
# commit message and both are checked for personal data.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # A run started by hand checks the whole history as new.
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request, where a new push cancels the previous run, and
# one per commit on main, where every commit must be checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/hygiene.yml@a0f76324c11738e82bb44b61c2f4746d750cb3b0 # v0.1.1
    permissions:
      contents: read
      # The hygiene job reads the current pull request title and body.
      pull-requests: read
    with:
      # Session links and noreply commit addresses of AI coding assistants.
      # Keep only the domains of the assistants that contribute.
      allowed-domains: anthropic.com claude.ai claude.com
      # The app's own runtime requirements, on top of the integration's.
      license-requirements: pet_recognition_engine/requirements.txt
    # Passes every secret: the denylist is the sum of the secrets whose names
    # start with PRIVACY_DENYLIST, and only the checks' own code reads them.
    secrets: inherit

  lint:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/python-lint.yml@a0f76324c11738e82bb44b61c2f4746d750cb3b0 # v0.1.1

  tests:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/ha-tests.yml@a0f76324c11738e82bb44b61c2f4746d750cb3b0 # v0.1.1

  validate:
    if: github.event.pull_request.draft != true
    uses: homeloom/ci/.github/workflows/ha-integration.yml@a0f76324c11738e82bb44b61c2f4746d750cb3b0 # v0.1.1

  # The app's Python package, tested with small generated models. The real
  # models are only downloaded when the app is built.
  engine:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pet_recognition_engine
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt --requirement requirements_test.txt

      - name: Run tests
        run: python -m pytest --cov-fail-under=95

  report:
    name: Report
    # Runs after failed or cancelled jobs too, so that it fails with them
    # rather than being skipped, which branch protection counts as passed.
    # Skipped on drafts like every job: GitHub never merges a draft, and
    # marking it ready for review starts a full run.
    if: ${{ always() && github.event.pull_request.draft != true }}
    needs: [hygiene, lint, tests, validate, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
