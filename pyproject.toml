[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D1",   # pydocstyle: missing docstrings
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

ignore = [
    # Magic methods and constructors are documented by their class.
    "D105",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
# Test names say what they test.
"tests/*" = ["D1", "S101"]
"pet_recognition_engine/tests/*" = ["D1", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "pet_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--cov-branch"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
